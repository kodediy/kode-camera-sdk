## kode-sdk at its release v0.1.5 (API v4), as an app for kodeOS pins it: one pin, and everything
## below its facade (kode_sys, kaos, kqp, khal, kdrv, klog, kbsp, QP/C) arrives at the same commit.
## The Camera SDK comes from this checkout; an app outside this repository pins kodediy/camera
## from git instead, at a release:
##
##   kodediy/camera:
##     git: https://github.com/kodediy/kode-camera-sdk.git
##     path: components/camera
##     version: <tag>
##
## and camera_types, camera_aos, camera_drv and camera_bsp arrive at the same commit through its own manifest.
## This example uses camera: the task layer (camera.h).
dependencies:
  idf: { version: "~6.1.0" }
  kodediy/kode:
    git: https://github.com/kodediy/kode-sdk.git
    path: components/kode
    version: v0.1.5
  kodediy/camera:
    override_path: "../../../components/camera"
  kodediy/camera_types:
    override_path: "../../../components/camera_types"
  kodediy/camera_aos:
    override_path: "../../../components/camera_aos"
  kodediy/camera_drv:
    override_path: "../../../components/camera_drv"
  kodediy/camera_bsp:
    override_path: "../../../components/camera_bsp"
